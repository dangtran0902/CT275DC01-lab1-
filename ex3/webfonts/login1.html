<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>
   <div class="container mt-4" style="max-width:400px;">
    <div class="card card-header bg-info-subtle text-info-emphasis py-2 ps-3">
        Biểu mẫu đăng nhập
    </div>
    <div class="border p-3 border-info">
        <form>
            <div class=" mb-3 align-items-center">
                <label for="email" class=" form-label fw-bold" >Email</label>
                <input type="email" name="email" class="form-control"  id="email" placeholder="Nhập vào email">
            </div>
            <div class=" mb-3">
                <label for="password" class=" form-label fw-bold" >Mật khẩu</label>
                <input type="password" name="password" class="form-control"  id="password" placeholder="Nhập vào mật khẩu">
            </div>
            <div class=" mb-3 align-items-center">
                <input class="form-check-input ps-3" type="checkbox" id="remember">
                <label for="" class="form-check-label ps-2" >Ghi nhớ tôi</label>
            </div>
              <div class=" mb-3 align-items-center">
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </div>
        </form>

    </div>
   </div> 
</body>
</html>
