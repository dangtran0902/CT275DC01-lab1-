<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu mẫu đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/all.min.css">
</head>

<body>
    <div class="container border border-danger mt-4" style="max-width: 400px;">
        <div class="p-2">
            <h2>Biểu mẫu đăng nhập</h2>
            <button type="button" data-bs-toggle="modal" data-bs-target="#loginModel"
                class="btn btn-info text-white mt-2">Mở hộp thoại</button>
        </div>
    </div>

    <div class="modal fade" id="loginModel" tabindex="-1" aria-labelledby="loginModelLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border border-danger">
                <div class="modal-header border-0 pb-0 justify-content-center position-relative">
                    <h3 class="modal-title fw-bold"><i class="fas fa-lock"></i> Đăng nhập</h3>
                    <button type="button" class="btn-close position-absolute end-0 top-0 m-3"
                        data-bs-dismiss="modal"></button>
                </div>
                <form>
                    <div class="modal-body px-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-user"></i> Người dùng:</label>
                            <input type="text" class="form-control" placeholder="Nhập tên người dùng">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-eye"></i> Mật khẩu:</label>
                            <input type="password" class="form-control" placeholder="Nhập mật khẩu">
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Ghi nhớ tôi</label>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2">
                            <i class="fas fa-power-off"></i> Đăng nhập
                        </button>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-3 justify-content-between">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                            <i class="fas fa-times"></i> Hủy bỏ
                        </button>
                        <div class="text-end small">
                            <div>Bạn chưa phải là thành viên? <a href="#" class="text-decoration-none">Đăng ký</a></div>
                            <div>Quên <a href="#" class="text-decoration-none">mật khẩu?</a></div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
