<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
</head>

<body>
    <div class="container mt-4" style="max-width: 1000px;">
        <div class="card border-subtle">
            <div class=" card-header  bg-primary text-white bs-light fw-bold ps-3 py-2">
            Biểu mẫu đăng nhập
        </div>
        <div class=" card-body  p-4">
            <form class="d-flex flex-wrap align-items-center justify-content-center gap-3 ">
                <div class="input-group" style="max-width: 240px;">
                    <span class=" input-group-text bg-secondary "><i class="bi bi-person-circle"></i></span>
                    <input type="email" class="form-control" name="email" id="email" placeholder="Nhập vào email">
                </div>
                 <div class="input-group" style="max-width: 240px;">
                    <span class=" input-group-text bg-secondary "><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" name="password" id="password" placeholder="Nhập vào mật khẩu">
                </div>
                 <div class="form-check">
                    <input type="checkbox" id="remember" class="form-check-input">
                    <label for="remember" class="form-check-label">Ghi nhớ tôi</label>
                </div>
                <button type="submit" class="btn btn-primary">Đăng nhập</button>
            </form>
        </div>
        </div>
        

    </div>

</body>

</html>
