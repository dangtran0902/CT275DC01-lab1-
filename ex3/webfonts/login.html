<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container mt-4" style="max-width: 480px;">
  <div class="card-header bg-info-subtle text-info-emphasis fw-semibold py-2 ps-3">
    Biểu mẫu đăng nhập
  </div>
  <div class="card-body border p-4  border-info ">  
    <form>
      <div class="row mb-3 align-items-center">
        <label for="email" class="col-sm-3 col-form-label text-sm-end fw-bold">Email:</label>
        <div class="col-sm-9">
          <input type="email" class="form-control" id="email" placeholder="Nhập vào email">
        </div>
      </div>
      <div class="row mb-3 align-items-center">
        <label for="pwd" class="col-sm-3 col-form-label text-sm-end fw-bold">Mật khẩu:</label>
        <div class="col-sm-9">
          <input type="password" class="form-control" id="pwd" placeholder="Nhập vào mật khẩu">
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-sm-9 offset-sm-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Ghi nhớ tôi</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-9 offset-sm-3">
          <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
